server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: usedcar-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval=true：MySQL 8 默认用 caching_sha2_password，
    # 不开这个参数在部分环境下会报 "Public Key Retrieval is not allowed"
    # serverTimezone 必须显式给，否则 LocalDate 可能因时区偏移差一天
    url: jdbc:mysql://localhost:3306/used_car?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: usedcar_app
    # 口令不落库、不进仓库，只从环境变量注入，冒号后留空表示「没有默认值」。
    # 没设置变量的后果是启动直接失败（Hikari 抛 Access denied），这是故意的：
    # 宁可起不来，也不要悄悄用上一个错误的口令把问题藏起来。
    #
    # 变量名用 USEDCAR_DB_PASSWORD 而不是 DB_PASSWORD：
    # 本机用户级环境变量里已存在 DB_PASSWORD（解愠在用），
    # Spring Boot 的优先级是「命令行参数 > 系统属性 > 操作系统环境变量 > application.yml」，
    # 用通用的 DB_PASSWORD 会被那个旧值覆盖，症状是 Access denied (using password: YES)。
    password: ${USEDCAR_DB_PASSWORD:}
    hikari:
      # 连接池上限：本机 MySQL 默认 max_connections=151，给 10 足够，留余量给别的客户端
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    # 开启下划线转驼峰：purchase_price → purchasePrice
    map-underscore-to-camel-case: true
    # 打印执行的 SQL 和参数，开发期必开，上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 逻辑删除：标注 @TableLogic 的字段用 1 表示已删、0 表示未删
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 前端请求头里带的 token 名
  token-name: satoken
  # 有效期 24 小时，单位秒
  timeout: 86400
  # 允许同一账号多端登录（开发期方便，上线按需改 false）
  is-concurrent: true
  # 多端登录时是否共用一个 token
  is-share: false
  token-style: uuid
  # 关掉 Sa-Token 自己的日志，避免刷屏
  is-log: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  video:
    # 占位供应商（mock）或真实供应商（seedance，尚未实现）。
    # mock 会真的用 FFmpeg 生成素材并合成成片，只是"上游素材"是本地造的
    provider: mock
    # 产物目录，相对 backend 运行目录
    work-dir: ./uploads/videos
    # ffmpeg 可执行文件，装在 PATH 里就写 ffmpeg
    ffmpeg-path: ffmpeg
  ai:
    deepseek:
      # 没配 key 时自动降级为本地模板文案，不会阻断视频流水线
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model: deepseek-chat

logging:
  level:
    root: info
    com.usedcar: debug
